<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3e8f9">
  <meta name="description" content="Guida TV italiana con programmi in onda, prima serata e timeline.">
  <title>Guida TV</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root{
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      --bg:#faf7fc;
      --surface:#ffffff;
      --surface-soft:#fff9ff;
      --ink:#1a1720;
      --muted:#7d7385;
      --line:#eadff0;
      --header:#f3e8f9;
      --header-2:#f8f2fb;
      --drawer:#2c2533;
      --accent:#6c63ff;
      --accent-2:#38c6e8;
      --accent-3:#ff8aa5;
      --accent-4:#92d36e;
      --accent-5:#ffcb57;
      --shadow:0 10px 26px rgba(64,40,76,.10);
      --soft-shadow:0 6px 16px rgba(64,40,76,.07);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fcf8ff 0%,#f8f6fb 100%);color:var(--ink)}
    body{overscroll-behavior-y:none}
    button,input{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
    .topbar{position:sticky;top:0;z-index:40;height:calc(78px + env(safe-area-inset-top));padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(243,232,249,.97),rgba(248,242,251,.97));backdrop-filter:blur(14px);border-bottom:1px solid #e7dced;box-shadow:0 8px 24px rgba(127,92,153,.07)}
    .icon-btn{border:0;background:transparent;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#2a2430;font-size:26px}
    .icon-btn:active{background:rgba(0,0,0,.06)}
    .brand{min-width:0;flex:1}
    .brand h1{margin:0;font-size:25px;line-height:1.05;font-weight:900;letter-spacing:-.4px}
    .brand .sub{margin-top:5px;color:#84788b;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .main{max-width:1040px;margin:0 auto;padding:14px}
    .hero-search{display:flex;gap:8px;margin-bottom:10px}
    .search{width:100%;border:1px solid #e1d7e8;background:#fff;color:#231f28;border-radius:18px;padding:13px 15px;outline:none;box-shadow:0 4px 14px rgba(42,31,45,.04)}
    .search:focus{border-color:#b79dd2;box-shadow:0 0 0 4px rgba(150,120,170,.12)}
    .chips{display:flex;gap:9px;overflow:auto;scrollbar-width:none;padding:2px 0 12px}
    .chips::-webkit-scrollbar{display:none}
    .chip{border:1px solid #ddd3e5;background:#fff;color:#544c5b;border-radius:999px;padding:10px 15px;white-space:nowrap;box-shadow:0 2px 10px rgba(70,50,90,.03)}
    .chip.active{background:linear-gradient(135deg,#2d2933,#464050);color:#fff;border-color:#2d2933;font-weight:800;box-shadow:0 10px 18px rgba(34,31,40,.18)}
    .status{font-size:12px;color:var(--muted);padding:4px 2px 12px}
    .cards{display:grid;gap:13px}
    .channel-card{background:linear-gradient(180deg,#fff 0%,#fffcff 100%);border:1px solid #ece2f0;border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
    .channel-head{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid #f0e8f3;background:linear-gradient(180deg,#fff 0%,#fdf9ff 100%)}
    .channel-logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#f2ebf7,#f8f3fb);display:grid;place-items:center;overflow:hidden;flex:0 0 auto;font-weight:900;font-size:11px;color:#443c4b;border:1px solid #ece2f0}
    .channel-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
    .channel-name{font-size:18px;font-weight:900;flex:1}
    .star{border:0;background:transparent;font-size:26px;color:#bbaec6;padding:5px}
    .star.on{color:#ffc83d}

    .programme{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 13px;border-top:1px solid #f2edf4;min-height:94px;position:relative}
    .programme:first-of-type{border-top:0}
    .programme.tone-general{background:linear-gradient(90deg,rgba(245,240,250,.66),rgba(255,255,255,0) 42%)}
    .programme.tone-sport{background:linear-gradient(90deg,rgba(206,238,255,.88),rgba(255,255,255,0) 42%)}
    .programme.tone-movie{background:linear-gradient(90deg,rgba(255,221,229,.9),rgba(255,255,255,0) 42%)}
    .programme.tone-kids{background:linear-gradient(90deg,rgba(255,245,196,.88),rgba(255,255,255,0) 42%)}
    .programme.tone-news{background:linear-gradient(90deg,rgba(221,248,236,.9),rgba(255,255,255,0) 42%)}
    .programme:after{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 8px 8px 0;background:transparent}
    .programme.tone-general:after{background:#b49ad0}
    .programme.tone-sport:after{background:#38c6e8}
    .programme.tone-movie:after{background:#ff8aa5}
    .programme.tone-kids:after{background:#ffcb57}
    .programme.tone-news:after{background:#92d36e}
    .thumb{width:96px;height:68px;border-radius:15px;overflow:hidden;position:relative;display:grid;place-items:center;color:white;font-weight:900;font-size:12px;border:1px solid rgba(0,0,0,.04);box-shadow:var(--soft-shadow)}
    .thumb.tone-general{background:linear-gradient(135deg,#4b4455,#756a84)}
    .thumb.tone-sport{background:linear-gradient(135deg,#278fcb,#55d2ea)}
    .thumb.tone-movie{background:linear-gradient(135deg,#ce587e,#ffb2c0)}
    .thumb.tone-kids{background:linear-gradient(135deg,#d99b27,#ffd66a)}
    .thumb.tone-news{background:linear-gradient(135deg,#4fa976,#9de4b8)}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .thumb .fallback{padding:8px;text-align:center;line-height:1.1;opacity:.96;text-shadow:0 1px 0 rgba(0,0,0,.16)}
    .thumb .time-tag{position:absolute;left:5px;bottom:5px;background:rgba(24,17,31,.76);color:#fff;border-radius:8px;padding:3px 6px;font-size:10px;font-variant-numeric:tabular-nums}
    .programme-title{font-size:16px;font-weight:850;line-height:1.22}
    .programme-desc{margin-top:5px;color:#72697a;font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .category{display:inline-block;margin-top:6px;color:#7d7385;font-size:11px;font-weight:700;background:rgba(255,255,255,.7);padding:3px 8px;border-radius:999px;border:1px solid rgba(0,0,0,.04)}
    .progress{height:5px;background:#ece5f1;border-radius:99px;overflow:hidden;margin-top:9px}
    .progress i{display:block;height:100%;background:linear-gradient(90deg,#6c63ff,#38c6e8);border-radius:99px}

    .empty{padding:34px 18px;text-align:center;color:#827a87;background:#fff;border:1px dashed #d9d0de;border-radius:18px}
    .timeline-shell{background:linear-gradient(180deg,#ffffff 0%,#fffcff 100%);border:1px solid #e8deee;border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
    .timeline-toolbar{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid #ece4f0;background:linear-gradient(180deg,#fff 0%,#fbf6fd 100%)}
    .timeline-toolbar strong{flex:1}
    .timeline-scroll{overflow:auto;max-height:calc(100vh - 210px);position:relative;background:#fff;overscroll-behavior:contain}
    .timeline-grid{position:relative;min-height:300px;background:linear-gradient(180deg,#fff 0%,#fcf9fe 100%)}
    .time-head{position:sticky;top:0;z-index:12;height:38px;background:#faf6fc;border-bottom:1px solid #e3dbe8}
    .time-label{position:absolute;top:0;height:38px;border-left:1px solid #e7dfe9;padding:9px 0 0 8px;font-size:12px;font-weight:800;color:#635a6a}
    .tl-row{position:relative;height:56px;border-bottom:1px solid #efe8f1}
    .tl-channel{position:sticky;left:0;z-index:10;width:112px;height:56px;background:#fff;border-right:1px solid #e8e0eb;display:flex;align-items:center;padding:6px 8px}
    .tl-channel-box{display:flex;align-items:center;gap:8px;min-width:0;width:100%}
    .tl-channel-badge{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#f1e9f7,#fbf6fd);display:grid;place-items:center;overflow:hidden;flex:0 0 auto;border:1px solid #ece2f0}
    .tl-channel-badge img{width:100%;height:100%;object-fit:contain;background:#fff}
    .tl-channel-badge span{font-size:10px;font-weight:900;color:#473f4d}
    .tl-channel-name{font-size:11px;font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tl-programme{position:absolute;top:6px;height:44px;border-radius:12px;padding:5px 8px;overflow:hidden;border:1px solid rgba(0,0,0,.05);font-size:11px;line-height:1.15;box-shadow:0 4px 10px rgba(60,42,74,.06)}
    .tl-programme strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tl-programme small{display:block;margin-top:4px;color:#615867;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tone-a{background:#f1e8fb}
    .tone-b{background:#d8efff}
    .tone-c{background:#ffdce7}
    .tone-d{background:#fff0b8}
    .tone-e{background:#ddf6e7}
    .now-line{position:absolute;top:38px;bottom:0;width:2px;background:#2cc6ea;z-index:11;box-shadow:0 0 0 1px rgba(44,198,234,.12)}
    .now-line:before{content:"";position:absolute;top:-5px;left:-4px;width:10px;height:10px;background:#2cc6ea;border-radius:50%}

    .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:70;opacity:0;pointer-events:none;transition:.2s}
    .drawer-overlay.open{opacity:1;pointer-events:auto}
    .drawer{position:absolute;left:0;top:0;bottom:0;width:min(84vw,340px);background:linear-gradient(180deg,#2c2533 0%,#201b26 100%);color:#fff;transform:translateX(-102%);transition:.22s ease;box-shadow:12px 0 30px rgba(0,0,0,.25);padding:calc(18px + env(safe-area-inset-top)) 0 24px;overflow:auto}
    .drawer-overlay.open .drawer{transform:translateX(0)}
    .drawer-head{padding:0 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
    .drawer-head strong{font-size:22px}
    .drawer-head div{font-size:12px;color:#bbb6bf;margin-top:4px}
    .drawer nav{padding:10px 0}
    .drawer-item{width:100%;border:0;background:transparent;color:#f6f2f8;display:flex;align-items:center;gap:14px;padding:13px 20px;text-align:left;font-size:17px}
    .drawer-item:active,.drawer-item.active{background:rgba(255,255,255,.09)}
    .drawer-icon{width:26px;text-align:center;font-size:20px;color:#d7c8ea}
    .drawer-sep{height:1px;background:rgba(255,255,255,.08);margin:8px 18px}

    .modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.58);display:none;align-items:flex-end}
    .modal.open{display:flex}
    .sheet{width:100%;max-height:86vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:0 0 calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 50px rgba(0,0,0,.22)}
    .sheet-hero{height:210px;background:linear-gradient(135deg,#2a2430,#6a6276);position:relative;overflow:hidden}
    .sheet-hero img{width:100%;height:100%;object-fit:cover}
    .sheet-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.62))}
    .sheet-close{position:absolute;right:14px;top:14px;z-index:2;border:0;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:22px}
    .sheet-body{padding:17px}
    .sheet-body h2{margin:0 0 6px;font-size:23px}
    .sheet-meta{color:#786f7b;font-size:13px;margin-bottom:12px}
    .sheet-body p{color:#57515a;line-height:1.45;font-size:14px}
    .source-credit{font-size:10px;color:#918895;padding:14px 2px 0;text-align:center}
    .source-credit a{color:inherit}

    @media(min-width:760px){
      .cards{grid-template-columns:1fr 1fr}
      .main{padding:18px}
      .programme{grid-template-columns:110px 1fr}
      .thumb{width:110px;height:76px}
      .tl-row{height:58px}
      .tl-channel{height:58px}
      .tl-programme{height:46px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Apri menu">☰</button>
      <div class="brand"><h1 id="pageTitle">Guida TV</h1><div class="sub" id="updated">Palinsesti italiani</div></div>
      <button class="icon-btn" id="refresh" aria-label="Aggiorna">↻</button>
    </header>

    <main class="main">
      <div class="hero-search"><input class="search" id="search" type="search" placeholder="Cerca canale o programma..." autocomplete="off"></div>
      <div class="chips" id="chips">
        <button class="chip active" data-view="now">In onda</button>
        <button class="chip" data-view="tonight">Prima serata</button>
        <button class="chip" data-view="timeline">Timeline</button>
        <button class="chip" data-view="today">Oggi</button>
        <button class="chip" data-view="tomorrow">Domani</button>
      </div>
      <div class="status" id="status">Caricamento palinsesti...</div>
      <section id="content"></section>
      <div class="source-credit">Palinsesti EPG di terze parti. Immagini programma, quando disponibili, da <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a>.</div>
    </main>
  </div>

  <div class="drawer-overlay" id="drawerOverlay">
    <aside class="drawer" role="dialog" aria-label="Menu">
      <div class="drawer-head"><strong>Guida TV</strong><div>La tua guida televisiva</div></div>
      <nav>
        <button class="drawer-item active" data-view="now"><span class="drawer-icon">▣</span>In onda / A seguire</button>
        <button class="drawer-item" data-view="tonight"><span class="drawer-icon">◷</span>Prima serata</button>
        <button class="drawer-item" data-view="timeline"><span class="drawer-icon">☷</span>Timeline</button>
        <button class="drawer-item" data-view="today"><span class="drawer-icon">☀</span>Oggi</button>
        <button class="drawer-item" data-view="tomorrow"><span class="drawer-icon">▦</span>Domani</button>
        <div class="drawer-sep"></div>
        <button class="drawer-item" data-view="favorites"><span class="drawer-icon">☆</span>Preferiti</button>
        <button class="drawer-item" data-view="channels"><span class="drawer-icon">▦</span>Canali</button>
      </nav>
    </aside>
  </div>

  <div class="modal" id="detailModal" aria-hidden="true">
    <div class="sheet">
      <div class="sheet-hero" id="detailHero"><button class="sheet-close" id="detailClose" aria-label="Chiudi">×</button></div>
      <div class="sheet-body">
        <h2 id="detailTitle"></h2>
        <div class="sheet-meta" id="detailMeta"></div>
        <p id="detailDesc"></p>
      </div>
    </div>
  </div>

  <script src="./app.js?v=4"></script>
</body>
</html>
