<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10131a">
  <meta name="description" content="Guida TV italiana: cosa c'è adesso, stasera, oggi e domani.">
  <title>Guida TV</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;background:#0b0d12;color:#f5f7fb;min-height:100vh}
    button,input{font:inherit}
    .app{max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(86px + env(safe-area-inset-bottom))}
    header{position:sticky;top:0;z-index:20;background:rgba(11,13,18,.94);backdrop-filter:blur(12px);padding:8px 0 12px}
    .top{display:flex;align-items:center;gap:12px}
    .logo{width:46px;height:46px;border-radius:14px;background:#fff;color:#10131a;display:grid;place-items:center;font-weight:900;font-size:20px}
    h1{font-size:24px;margin:0}
    .sub{font-size:12px;color:#9aa3b4;margin-top:2px}
    .refresh{margin-left:auto;border:0;border-radius:12px;background:#202633;color:#fff;padding:10px 12px}
    .search{width:100%;margin-top:12px;border:1px solid #2b3240;background:#151922;color:#fff;border-radius:14px;padding:12px 14px;outline:none}
    .tabs{display:flex;gap:8px;overflow:auto;padding:12px 0 4px;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tab{border:1px solid #2b3240;background:#151922;color:#bec6d4;border-radius:999px;padding:9px 14px;white-space:nowrap}
    .tab.active{background:#f5f7fb;color:#10131a;border-color:#f5f7fb;font-weight:800}
    .status{padding:12px 0;color:#aeb7c5;font-size:13px}
    .cards{display:grid;gap:10px}
    .card{background:#141821;border:1px solid #242b38;border-radius:18px;padding:14px}
    .channel-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .badge{width:42px;height:42px;border-radius:12px;background:#242b38;display:grid;place-items:center;font-weight:900;font-size:12px;overflow:hidden;flex:0 0 auto}
    .badge img{width:100%;height:100%;object-fit:contain;background:#fff}
    .channel-name{font-weight:850;font-size:17px}
    .star{margin-left:auto;border:0;background:transparent;color:#738096;font-size:24px;line-height:1;padding:4px}
    .star.on{color:#ffd85a}
    .programme{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:9px 0;border-top:1px solid #222936}
    .programme:first-of-type{border-top:0}
    .time{font-variant-numeric:tabular-nums;color:#8e9aab;font-size:13px;font-weight:700;padding-top:2px}
    .title{font-weight:750;line-height:1.25}
    .desc{color:#9aa3b4;font-size:13px;margin-top:4px;line-height:1.35}
    .progress{height:4px;background:#252c38;border-radius:4px;overflow:hidden;margin-top:8px}
    .progress>i{display:block;height:100%;background:#f5f7fb;border-radius:4px}
    .empty{padding:32px 18px;text-align:center;color:#9aa3b4;background:#141821;border:1px dashed #303847;border-radius:18px}
    footer{padding:24px 4px;color:#697487;font-size:11px;text-align:center}
    @media(min-width:700px){.cards{grid-template-columns:1fr 1fr}.card{height:max-content}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="top">
        <div class="logo">TV</div>
        <div><h1>Guida TV</h1><div class="sub" id="updated">Palinsesti italiani</div></div>
        <button class="refresh" id="refresh" aria-label="Aggiorna">↻</button>
      </div>
      <input class="search" id="search" type="search" placeholder="Cerca canale o programma..." autocomplete="off">
      <nav class="tabs" aria-label="Sezioni">
        <button class="tab active" data-view="now">Adesso</button>
        <button class="tab" data-view="tonight">Stasera</button>
        <button class="tab" data-view="today">Oggi</button>
        <button class="tab" data-view="tomorrow">Domani</button>
        <button class="tab" data-view="favorites">Preferiti</button>
      </nav>
    </header>
    <div class="status" id="status">Caricamento palinsesti...</div>
    <section class="cards" id="cards"></section>
    <footer>Guida TV · prototipo PWA · dati EPG di terze parti</footer>
  </main>
  <script src="./app.js"></script>
</body>
</html>
