<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#efe7f3">
  <meta name="description" content="Guida TV italiana con programmi in onda, prima serata e timeline.">
  <title>Guida TV</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root{
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      --bg:#f7f5f8;--surface:#fff;--ink:#18171b;--muted:#77727e;--line:#e7e0ea;
      --header:#efe7f3;--drawer:#2d2d30;--accent:#37c5e8;--pink:#ffd9df;--blue:#cceaff;
      --shadow:0 8px 28px rgba(40,28,45,.10);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
    body{overscroll-behavior-y:none}
    button,input{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
    .topbar{position:sticky;top:0;z-index:40;height:calc(72px + env(safe-area-inset-top));padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;background:rgba(239,231,243,.96);backdrop-filter:blur(14px);border-bottom:1px solid #e2d8e8}
    .icon-btn{border:0;background:transparent;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#222;font-size:26px}
    .icon-btn:active{background:rgba(0,0,0,.06)}
    .brand{min-width:0;flex:1}.brand h1{margin:0;font-size:25px;line-height:1.05;font-weight:900;letter-spacing:-.4px}.brand .sub{margin-top:4px;color:#7c7381;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .main{max-width:980px;margin:0 auto;padding:14px}
    .hero-search{display:flex;gap:8px;margin-bottom:10px}.search{width:100%;border:1px solid #dfd7e4;background:#fff;color:#222;border-radius:15px;padding:12px 14px;outline:none;box-shadow:0 3px 14px rgba(42,31,45,.04)}
    .search:focus{border-color:#b8a9c1;box-shadow:0 0 0 3px rgba(150,120,170,.12)}
    .chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding:2px 0 12px}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid #ddd5e2;background:#fff;color:#4d4652;border-radius:999px;padding:9px 14px;white-space:nowrap}.chip.active{background:#28252c;color:#fff;border-color:#28252c;font-weight:800}
    .status{font-size:12px;color:var(--muted);padding:2px 2px 10px}
    .cards{display:grid;gap:12px}.channel-card{background:var(--surface);border:1px solid #e8e2eb;border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
    .channel-head{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid #eee8f0}.channel-logo{width:44px;height:44px;border-radius:12px;background:#f3f0f4;display:grid;place-items:center;overflow:hidden;flex:0 0 auto;font-weight:900;font-size:11px}.channel-logo img{width:100%;height:100%;object-fit:contain;background:#fff}.channel-name{font-size:18px;font-weight:900;flex:1}.star{border:0;background:transparent;font-size:26px;color:#b2aab6;padding:5px}.star.on{color:#ffc83d}
    .programme{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:11px 13px;border-top:1px solid #f1edf2;min-height:92px}.programme:first-of-type{border-top:0}.thumb{width:96px;height:68px;border-radius:13px;overflow:hidden;background:linear-gradient(135deg,#27252b,#4a4450);position:relative;display:grid;place-items:center;color:white;font-weight:900;font-size:12px}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb .fallback{padding:8px;text-align:center;line-height:1.1;opacity:.9}.thumb .time-tag{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.72);color:#fff;border-radius:7px;padding:3px 6px;font-size:10px;font-variant-numeric:tabular-nums}.programme-title{font-size:16px;font-weight:850;line-height:1.22}.programme-desc{margin-top:5px;color:#7f7783;font-size:12px;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.category{display:inline-block;margin-top:6px;color:#8d8391;font-size:11px}.progress{height:4px;background:#eee8ef;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:#2dc0e8;border-radius:99px}
    .empty{padding:34px 18px;text-align:center;color:#827a87;background:#fff;border:1px dashed #d9d0de;border-radius:18px}
    .timeline-shell{background:#fff;border:1px solid #e5dfe8;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.timeline-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #e9e3eb}.timeline-toolbar strong{flex:1}.timeline-scroll{overflow:auto;max-height:calc(100vh - 210px);position:relative;background:#fff;overscroll-behavior:contain}.timeline-grid{position:relative;min-height:300px}.time-head{position:sticky;top:0;z-index:12;height:42px;background:#faf7fb;border-bottom:1px solid #ddd6e1}.time-label{position:absolute;top:0;height:42px;border-left:1px solid #e2dce5;padding:10px 0 0 7px;font-size:12px;font-weight:800;color:#5a535e}.tl-row{position:relative;height:76px;border-bottom:1px solid #ece7ee}.tl-channel{position:sticky;left:0;z-index:10;width:82px;height:76px;background:#fff;border-right:1px solid #e4dde6;display:flex;align-items:center;justify-content:center;padding:6px}.tl-channel img{max-width:64px;max-height:52px;object-fit:contain}.tl-channel span{font-size:11px;font-weight:900;text-align:center}.tl-programme{position:absolute;top:6px;height:64px;border-radius:9px;padding:7px 8px;overflow:hidden;border:1px solid rgba(0,0,0,.06);font-size:12px;line-height:1.18}.tl-programme strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tl-programme small{display:block;margin-top:5px;color:#68616b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tone-a{background:#f4f1f5}.tone-b{background:#d8efff}.tone-c{background:#ffdce2}.now-line{position:absolute;top:42px;bottom:0;width:2px;background:#2cc6ea;z-index:11;box-shadow:0 0 0 1px rgba(44,198,234,.12)}.now-line:before{content:"";position:absolute;top:-5px;left:-4px;width:10px;height:10px;background:#2cc6ea;border-radius:50%}
    .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:70;opacity:0;pointer-events:none;transition:.2s}.drawer-overlay.open{opacity:1;pointer-events:auto}.drawer{position:absolute;left:0;top:0;bottom:0;width:min(84vw,340px);background:var(--drawer);color:#fff;transform:translateX(-102%);transition:.22s ease;box-shadow:12px 0 30px rgba(0,0,0,.25);padding:calc(18px + env(safe-area-inset-top)) 0 24px;overflow:auto}.drawer-overlay.open .drawer{transform:translateX(0)}.drawer-head{padding:0 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}.drawer-head strong{font-size:22px}.drawer-head div{font-size:12px;color:#bbb6bf;margin-top:4px}.drawer nav{padding:10px 0}.drawer-item{width:100%;border:0;background:transparent;color:#f3f1f4;display:flex;align-items:center;gap:14px;padding:13px 20px;text-align:left;font-size:17px}.drawer-item:active,.drawer-item.active{background:rgba(255,255,255,.09)}.drawer-icon{width:26px;text-align:center;font-size:20px;color:#c8c3ca}.drawer-sep{height:1px;background:rgba(255,255,255,.08);margin:8px 18px}
    .modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.58);display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:86vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:0 0 calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 50px rgba(0,0,0,.22)}.sheet-hero{height:210px;background:linear-gradient(135deg,#242028,#544c59);position:relative;overflow:hidden}.sheet-hero img{width:100%;height:100%;object-fit:cover}.sheet-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.62))}.sheet-close{position:absolute;right:14px;top:14px;z-index:2;border:0;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:22px}.sheet-body{padding:17px}.sheet-body h2{margin:0 0 6px;font-size:23px}.sheet-meta{color:#786f7b;font-size:13px;margin-bottom:12px}.sheet-body p{color:#57515a;line-height:1.45;font-size:14px}.source-credit{font-size:10px;color:#918895;padding:14px 2px 0;text-align:center}.source-credit a{color:inherit}
    @media(min-width:760px){.cards{grid-template-columns:1fr 1fr}.main{padding:18px}.programme{grid-template-columns:110px 1fr}.thumb{width:110px;height:76px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Apri menu">☰</button>
      <div class="brand"><h1 id="pageTitle">Guida TV</h1><div class="sub" id="updated">Palinsesti italiani</div></div>
      <button class="icon-btn" id="refresh" aria-label="Aggiorna">↻</button>
    </header>

    <main class="main">
      <div class="hero-search"><input class="search" id="search" type="search" placeholder="Cerca canale o programma..." autocomplete="off"></div>
      <div class="chips" id="chips">
        <button class="chip active" data-view="now">In onda</button>
        <button class="chip" data-view="tonight">Prima serata</button>
        <button class="chip" data-view="timeline">Timeline</button>
        <button class="chip" data-view="today">Oggi</button>
        <button class="chip" data-view="tomorrow">Domani</button>
      </div>
      <div class="status" id="status">Caricamento palinsesti...</div>
      <section id="content"></section>
      <div class="source-credit">Palinsesti EPG di terze parti. Immagini programma, quando disponibili, da <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a>.</div>
    </main>
  </div>

  <div class="drawer-overlay" id="drawerOverlay">
    <aside class="drawer" role="dialog" aria-label="Menu">
      <div class="drawer-head"><strong>Guida TV</strong><div>La tua guida televisiva</div></div>
      <nav>
        <button class="drawer-item active" data-view="now"><span class="drawer-icon">▣</span>In onda / A seguire</button>
        <button class="drawer-item" data-view="tonight"><span class="drawer-icon">◷</span>Prima serata</button>
        <button class="drawer-item" data-view="timeline"><span class="drawer-icon">☷</span>Timeline</button>
        <button class="drawer-item" data-view="today"><span class="drawer-icon">☀</span>Oggi</button>
        <button class="drawer-item" data-view="tomorrow"><span class="drawer-icon">▦</span>Domani</button>
        <div class="drawer-sep"></div>
        <button class="drawer-item" data-view="favorites"><span class="drawer-icon">☆</span>Preferiti</button>
        <button class="drawer-item" data-view="channels"><span class="drawer-icon">▦</span>Canali</button>
      </nav>
    </aside>
  </div>

  <div class="modal" id="detailModal" aria-hidden="true">
    <div class="sheet">
      <div class="sheet-hero" id="detailHero"><button class="sheet-close" id="detailClose" aria-label="Chiudi">×</button></div>
      <div class="sheet-body">
        <h2 id="detailTitle"></h2>
        <div class="sheet-meta" id="detailMeta"></div>
        <p id="detailDesc"></p>
      </div>
    </div>
  </div>

  <script src="./app.js?v=2"></script>
</body>
</html>
